<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e6"><title>Ceyda & Halil | Nikâh Davetiyesi</title><link rel="stylesheet" href="style.css?v=20261026-2"></head>
<body>
<div id="cover" class="cover" role="button" tabindex="0" aria-label="Davetiyeyi aç"><div class="cover-photo"></div></div>
<main class="invitation" aria-label="Ceyda ve Halil nikâh davetiyesi">
  <img class="art" src="davetiye.png" alt="Ceyda ve Halil nikâh davetiyesi, 1 Kasım 2026 Pazar 13.15" />
  <button class="music-hit" id="musicToggle" aria-label="Müziği aç veya kapat" title="Müzik"></button>
  <section class="dynamic" aria-label="Geri sayım ve konum">
    <h2>ÖZEL GÜNÜMÜZE<br>KALAN SÜRE</h2>
    <div class="counter" aria-live="off">
      <div class="countbox"><strong id="days">00</strong><span>GÜN</span></div>
      <div class="countbox"><strong id="hours">00</strong><span>SAAT</span></div>
      <div class="countbox"><strong id="minutes">00</strong><span>DK</span></div>
      <div class="countbox"><strong id="seconds">00</strong><span>SN</span></div>
    </div>
    <div class="star" aria-hidden="true">✦</div>
    <div class="pin" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
    <h3>DENİZLİ<br>MERKEZEFENDİ KÜLTÜR<br>MERKEZİ</h3>
    <div class="map"><iframe title="Denizli Merkezefendi Kültür Merkezi haritası" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Merkezefendi%20K%C3%BClt%C3%BCr%20Merkezi%20Denizli&output=embed"></iframe></div>
    <a class="directions" href="https://maps.app.goo.gl/uxKnvJDo62g8kEkaA?g_st=iw" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16M15 5v16"/></svg>YOL TARİFİ AL</a>
  </section>
</main>
<audio id="music" src="muzik.mp3" loop preload="none"></audio><script src="script.js?v=20261026-2"></script>
</body></html>
