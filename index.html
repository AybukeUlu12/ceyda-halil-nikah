<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e8">
  <title>Ceyda & Halil | Nikâh Davetiyesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div id="cover" class="cover" aria-label="Davetiye kapağı">
    <div class="cover-leaf">
      <img src="kapak.jpg" alt="Ceyda ve Halil nikâh davetiyesi, altın mühürlü çiçekli kapak">
      <button id="open" class="seal-hit" type="button" aria-label="Mühre dokunarak davetiyeyi aç"></button>
    </div>
  </div>
  <main id="invitation" class="invitation" inert>
    <div class="fine-frame" aria-hidden="true"></div>
    <img class="flower flower-top" src="cicek-ust.png" alt="" aria-hidden="true">
    <img class="flower flower-bottom" src="cicek-alt.png" alt="" aria-hidden="true">
    <section class="hero" aria-label="Nikâh davetiyesi">
      <div class="names"><span>Ceyda</span><em>ve</em><span>Halil</span></div>
      <h1>NİKÂH TÖRENİMİZE<br>DAVETLİSİNİZ</h1>
      <div class="date-row">
        <div class="date-item"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h2M12 14h2M17 14h1"/></svg><strong>1 KASIM 2026</strong><small>PAZAR</small></div>
        <span class="date-rule" aria-hidden="true"></span>
        <div class="date-item"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/></svg><strong>13:15</strong><small>SAAT</small></div>
      </div>
      <p class="quote">Bu özel günde mutluluğumuzu sizinle paylaşmak bizi çok mutlu edecek.</p>
      <div class="scroll-hint">AŞAĞI KAYDIRIN <span aria-hidden="true">⌄</span></div>
    </section>
    <section class="countdown-section" aria-label="Geri sayım">
      <h2>ÖZEL GÜNÜMÜZE<br>KALAN SÜRE</h2>
      <div class="countdown">
        <div><b id="days">00</b><small>GÜN</small></div>
        <div><b id="hours">00</b><small>SAAT</small></div>
        <div><b id="minutes">00</b><small>DK</small></div>
        <div><b id="seconds">00</b><small>SN</small></div>
      </div>
      <div class="ornament" aria-hidden="true">❧</div>
    </section>
    <section class="venue" aria-label="Tören yeri">
      <h2>MEKÂN</h2>
      <h3>Denizli Merkezefendi<br>Kültür Merkezi</h3>
      <div class="map"><iframe title="Denizli Merkezefendi Kültür Merkezi haritası" src="https://maps.google.com/maps?q=Denizli%20Merkezefendi%20K%C3%BClt%C3%BCr%20Merkezi&z=15&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
      <a class="directions" href="https://maps.app.goo.gl/uxKnvJDo62g8kEkaA?g_st=iw" target="_blank" rel="noopener noreferrer">YOL TARİFİ AL</a>
      <div class="ornament ornament-end" aria-hidden="true">❧</div>
    </section>
  </main>
  <button id="musicToggle" class="music-toggle" type="button" aria-label="Müziği aç veya kapat" hidden>♫</button>
  <audio id="music" src="muzik.mp3" preload="auto" loop playsinline></audio>
  <script src="script.js?v=10"></script>
</body>
</html>
